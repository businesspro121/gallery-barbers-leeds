# Publishes the site to GitHub Pages on every push to main.
# Enable once: repo Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

# While the repo is PRIVATE, Pages publishing needs a paid GitHub plan, so this
# runs on demand only — otherwise every push would leave a failed red run.
#
# Once the repo is public (or you're on a plan that allows private Pages):
#   1. Settings > Pages > Source: "GitHub Actions"
#   2. uncomment the two `push:` lines below
# and it will publish on every push to main again.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Static site - nothing to build, upload the repo as-is.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
