# Publishes the site to GitHub Pages on every push to main.
#
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# The repo must be public, or on a plan that allows Pages from private repos.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only what the website needs. The photo originals in
      # source-photos/, the build scripts and the React component stay in the
      # repo but are deliberately kept off the public site.
      - name: Assemble the published site
        run: |
          mkdir -p dist
          cp index.html privacy.html cookies.html terms.html dist/
          cp robots.txt sitemap.xml dist/
          cp -r assets dist/
          touch dist/.nojekyll
          echo "Published files:" && find dist -type f | wc -l

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
